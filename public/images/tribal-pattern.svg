<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <g fill="none" stroke="#FFFFFF" stroke-opacity="1">
    <!-- Diamond Lattice -->
    <path d="M 60 0 L 120 60 L 60 120 L 0 60 Z" stroke-width="1.5" />
    <path d="M 60 15 L 105 60 L 60 105 L 15 60 Z" stroke-width="1" stroke-dasharray="3,3" />
    <path d="M 60 30 L 90 60 L 60 90 L 30 60 Z" stroke-width="1.5" />
    
    <!-- Corner Diamonds (for seamless tiling) -->
    <path d="M 0 0 L 30 0 L 0 30 Z M 120 0 L 90 0 L 120 30 Z M 120 120 L 90 120 L 120 90 Z M 0 120 L 30 120 L 0 90 Z" stroke-width="1" />
    
    <!-- Center tribal sun / star motif -->
    <polygon points="60,42 64,56 78,60 64,64 60,78 56,64 42,60 56,56" fill="#FFFFFF" fill-opacity="0.8" stroke="none" />
    
    <!-- Chevron / Zigzag tribal weaves -->
    <polyline points="0,60 15,45 30,60 45,45 60,60 75,45 90,60 105,45 120,60" stroke-width="1" />
    <polyline points="0,60 15,75 30,60 45,75 60,60 75,75 90,60 105,75 120,60" stroke-width="1" />
    
    <!-- Accent Dots -->
    <circle cx="60" cy="15" r="2.5" fill="#FFFFFF" stroke="none" />
    <circle cx="60" cy="105" r="2.5" fill="#FFFFFF" stroke="none" />
    <circle cx="15" cy="60" r="2.5" fill="#FFFFFF" stroke="none" />
    <circle cx="105" cy="60" r="2.5" fill="#FFFFFF" stroke="none" />
    <circle cx="60" cy="60" r="3" fill="none" stroke-width="1.5" />
  </g>
</svg>
